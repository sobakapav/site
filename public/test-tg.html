				const bestKey = topStatistics[bestKeyIdx];

				var gender;
				if (testStatistics['Gender-M'] > 0 || (testStatistics['Gender-U'] > 0 && Math.random() < 0.5)) {
					gender = 'Gender-M';
				} else {
					gender = 'Gender-F';
				}
				
				showOutcome(bestKey, gender);
			}
			
			function showOutcome(key, gender) {
				const selectedOutcome = OUTCOMES.find((outcome) => (outcome.option == key && outcome.gender == gender));

				const resultString = `<div class="result-body">${selectedOutcome.text}</div><div class="result-link"><p><b>Помогите сделать Третьяковку лучше.</b> Как и ${selectedOutcome.title}, вы можете помочь музею — и нужны не миллионы, а примерно час вашего времени. Сейчас команда UX-исследователей изучает, как сделать наш интернет-магазин понятней и удобней.</p><p><b>Ваш опыт мецената очень важен.</b> Если хотите участвовать в исследовании, нажмите кнопку ниже. Вам придет письмо с адреса <a href="mailto:we@eduhund.com">we@eduhund.com</a> с условиями участия и подробностями про исследование.</p><a href="https://google.com?q=${testStat}">Хочу участвовать в исследовании!</a><p>Нажимая кнопку, вы соглашаетесь на передачу контактных данных команде «Собака Павлова» для связи по поводу исследования.</p><p><b>Код для вставки в соцсети:</b> [здесь будет код для соцсетей]</p></div>`; 

				document.getElementById('greeting').innerHTML = selectedOutcome.title;
				selectedOutcome.portrait && (document.getElementById('img-container').innerHTML = selectedOutcome.portrait);
				document.getElementById('questionnaire-result-body').innerHTML = resultString;
			}
			
            const testBody = document.getElementById('test-body');

            testBody.addEventListener("click", showNext);

            for (const question of QUESTIONS) {
                var questionBlock = '<div class="test-element">';
                questionBlock += `<div class="question-header">${question.question}</div>`;
                for (const option of question.options) {
                    questionBlock += `<div class="question-option" data-option=${option.result} data-stat=${option.stat || ''}>${option.option}</div>`;
                }
                questionBlock += '</div>';

                testBody.insertAdjacentHTML('beforeend', questionBlock);
            }

            testBody.insertAdjacentHTML('beforeend', '<div class="test-element questionnaire-result"><div id="questionnaire-result-body">Сейчас мы вам его сосчитаем.</div></div>');
        </script>
    </body>
</html>
